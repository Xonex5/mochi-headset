[package]
name = "mochi-plugin-headset"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "headset"
path = "src/main.rs"

[dependencies]
# The SDK of the Mochi release installed here. Protocol API 1, as every 0.x.
mochi-sdk = { git = "https://github.com/Davidutz19/mochi", tag = "v0.4.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt", "time"] }
